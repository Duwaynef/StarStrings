name: Dynamic Auto-Branch Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:   # Allows manual trigger

# CRITICAL: Grants the runner permission to push commits back to your repository
permissions:
  contents: write

jobs:
  sync-dynamic-branches:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out your fork with full history
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Configure Git identity
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Step 3: Add the parent repo as 'upstream' and fetch its branches
      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/MrKraken/StarStrings.git || git remote set-url upstream https://github.com/MrKraken/StarStrings.git
          git fetch upstream --prune

      # Step 4: Dynamically detect and merge all branches
      - name: Detect and Sync All Remote Branches
        run: |
          # 1. Fetch upstream branches safely (using || true so empty grep doesn't trigger set -e)
          UPSTREAM_BRANCHES=$(git branch -r | grep 'upstream/' | grep -v 'HEAD' | sed 's/^[[:space:]]*upstream\///' || true)

          if [ -z "$UPSTREAM_BRANCHES" ]; then
            echo "[!] No upstream branches found to sync."
            exit 0
          fi

          echo "[*] Found the following upstream branches to sync:"
          echo "$UPSTREAM_BRANCHES"

          # 2. Loop through every detected branch
          for branch in $UPSTREAM_BRANCHES; do
            echo "------------------------------------------------------"
            echo "[*] Dynamically syncing branch: $branch"
            echo "------------------------------------------------------"

            # 3. Track or switch to your fork's copy of that branch safely
            if git show-ref --verify --quiet "refs/heads/$branch"; then
              git checkout "$branch"
            elif git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              git checkout -b "$branch" "origin/$branch"
            else
              git checkout -b "$branch" "upstream/$branch"
            fi

            # 4. Merge parent's matching branch
            if git merge "upstream/$branch" --allow-unrelated-histories -m "Automated sync: Merged upstream $branch updates"; then
              # 5. Push wrapped in an if-statement so a push rejection doesn't crash the runner
              if git push origin "$branch"; then
                echo "[+] Successfully synced $branch"
              else
                echo "[!] Push failed for $branch (check branch protection settings)."
              fi
            else
              echo "[!] Merge conflict detected on $branch. Skipping push."
              git merge --abort || true
            fi
          done
